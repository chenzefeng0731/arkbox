name: test

on:
  push:
  pull_request:

jobs:
  selftest:
    env:
      PYTHONUTF8: "1"   # Windows runner 默认 cp1252，与真实 UTF-8 环境对齐
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run self-test
        run: python skill/arkbox/scripts/selftest.py
      - name: Run E2E smoke
        run: python tests/e2e_check.py
